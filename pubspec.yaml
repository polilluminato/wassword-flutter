name: wassword
description: Wassword - Wonderful Password Generator

version: 3.2.0+29

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  auto_route: ^11.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_styled_toast: ^2.3.0
  freezed_annotation: ^3.1.0
  package_info_plus: ^9.0.0
  phosphor_flutter: ^2.1.0
  riverpod_annotation: ^3.0.3
  share_plus: ^12.0.1
  universal_platform: ^1.1.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

dev_dependencies:
  auto_route_generator: ^10.4.0
  build_runner: ^2.10.4
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  riverpod_generator: ^3.0.3

# Launcher Icons
flutter_launcher_icons:
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/ic_background.png"
  adaptive_icon_foreground: "assets/icon/ic_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#A700B6"

# Splash Screen
flutter_native_splash:
  android: true
  android_gravity: center
  color_android: "#A700B6"
  image_android: assets/icon/ic_splash.png
  #iOS
  ios: true
  #web
  web: true
  web_image_mode: center
  image: assets/icon/ic_splash.png
  color: "#A700B6"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
